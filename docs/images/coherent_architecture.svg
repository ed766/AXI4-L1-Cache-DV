<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><style>.title{font:700 28px Georgia;fill:#142b35}.h{font:700 17px Georgia;fill:#142b35}.t{font:14px Georgia;fill:#294550}.box{fill:#f7f2e8;stroke:#1b6573;stroke-width:2}.accent{fill:#f2b38f;stroke:#a64c2a;stroke-width:2}.ok{fill:#dce9e7;stroke:#28705b;stroke-width:2}.line{stroke:#1b6573;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1b6573"/></marker></defs><rect width="100%" height="100%" fill="#fffdf7"/><text class="title" x="35" y="48">Executable dual-RV32 coherent crossover</text><rect class="box" x="30" y="105" width="160" height="90" rx="14"/><text class="h" x="45" y="140">Hart 0</text><text class="t" x="45" y="167">GCC RV32I</text><rect class="box" x="30" y="300" width="160" height="90" rx="14"/><text class="h" x="45" y="335">Hart 1</text><text class="t" x="45" y="362">GCC RV32I</text><rect class="box" x="245" y="105" width="175" height="90" rx="14"/><text class="h" x="260" y="140">Store buffer 0</text><text class="t" x="260" y="167">2 entries + FENCE</text><rect class="box" x="245" y="300" width="175" height="90" rx="14"/><text class="h" x="260" y="335">Store buffer 1</text><text class="t" x="260" y="362">2 entries + FENCE</text><rect class="box" x="485" y="100" width="190" height="295" rx="14"/><text class="h" x="500" y="135">AXI QoS transport</text><text class="t" x="500" y="162">IDs, BP, faults</text><rect class="box" x="735" y="80" width="220" height="150" rx="14"/><text class="h" x="750" y="115">MSI bank 0</text><text class="t" x="750" y="142">same-bank serialize</text><rect class="box" x="735" y="285" width="220" height="150" rx="14"/><text class="h" x="750" y="320">MSI bank 1</text><text class="t" x="750" y="347">different-bank overlap</text><rect class="box" x="1020" y="185" width="145" height="145" rx="14"/><text class="h" x="1035" y="220">Shared SRAM</text><text class="t" x="1035" y="247">coherent data</text><path class="line" d="M190,150 L245,150"/><path class="line" d="M190,345 L245,345"/><path class="line" d="M420,150 L485,150"/><path class="line" d="M420,345 L485,345"/><path class="line" d="M675,150 L735,150"/><path class="line" d="M675,345 L735,345"/><path class="line" d="M955,155 L1020,230"/><path class="line" d="M955,360 L1020,285"/><text class="t" x="480" y="455">Internal bank aliasing is removed before each request reaches the MSI home.</text></svg>